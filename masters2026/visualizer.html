<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Periodic Patrol Automata - Visualizer</title>
<style>
body { font-family: monospace; margin: 10px; }
textarea { font-family: monospace; font-size: 12px; }
#error { color: red; min-height: 1em; }
#score { font-weight: bold; font-size: 16px; }
.ctrl { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
</style>

<body>
<p>
  Preset:
  <select id="problemSelect"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
  <select id="seedSelect"></select>
  <button id="loadPreset">Load</button>
</p>
<p>
  In Dir: <input type="file" id="inDirSelect" webkitdirectory directory>
  Out Dir: <input type="file" id="outDirSelect" webkitdirectory directory>
  <button id="prevFile">&lt;</button>
  <select id="fileSelect" disabled style="width:200px"></select>
  <button id="nextFile">&gt;</button>
</p>
<p>
  Input <input type="file" id="inputFile" accept=".txt"><br>
  <textarea id="input" rows="4" style="width:650px" oninput="onInputChange()"></textarea>
</p>
<p>
  Output <input type="file" id="outputFile" accept=".txt"><br>
  <textarea id="output" rows="4" style="width:650px" oninput="onInputChange()"></textarea>
</p>
<p><button onclick="savePng()">Save as PNG</button></p>
<div class="ctrl">
  <input type="button" id="play" value="&#x25B6;" style="width:32px;height:32px">
  <span>slow</span>
  <input type="range" id="speed" min="1" max="60" value="30" style="width:200px">
  <span>fast</span>
  <span>turn</span>
  <input type="number" id="turn" value="0" min="0" style="width:80px" oninput="update_t(parseInt(this.value))">
</div>
<div>
  <input type="range" id="t_bar" min="0" max="0" value="0" style="width:780px" oninput="update_t(parseInt(this.value))">
</div>
<hr>
<p id="score">Score = </p>
<p id="stats"></p>
<p id="error"></p>
<div id="result"></div>

document.getElementById('loadPreset').onclick = function() {
  var prob = document.getElementById('problemSelect').value;
  var seed = document.getElementById('seedSelect').value;
  var key = prob + '_' + seed;
  if (INPUTS[key]) {
    document.getElementById('input').value = INPUTS[key];
    onInputChange();
  }
};

var DIR = ['U','R','D','L'];
var DI = [-1,0,1,0];
var DJ = [0,1,0,-1];
var state = null;
var currentTurn = 0;
var inDirFiles = {};
var outDirFiles = {};
var outDirNames = [];

function parseInput(text) {
  var tokens = text.trim().split(/\s+/);
  var idx = 0;
  var N = parseInt(tokens[idx++]);
  var AK = parseInt(tokens[idx++]);
  var AM = parseInt(tokens[idx++]);
  var AW = parseInt(tokens[idx++]);
  var wall_v = [];
  for (var i = 0; i < N; i++) wall_v.push(tokens[idx++].split(''));
  var wall_h = [];
  for (var i = 0; i < N - 1; i++) wall_h.push(tokens[idx++].split(''));
  return {N:N, AK:AK, AM:AM, AW:AW, wall_v:wall_v, wall_h:wall_h};
}

function parseOutput(inp, text) {
  var tokens = text.trim().split(/\s+/);
  var idx = 0;
  var K = parseInt(tokens[idx++]);
  if (K < 1 || K > inp.N * inp.N) throw new Error("K out of range: " + K);
  var robots = [];
  for (var k = 0; k < K; k++) {
    var m = parseInt(tokens[idx++]);
    var ri = parseInt(tokens[idx++]);
    var rj = parseInt(tokens[idx++]);
    var dChar = tokens[idx++];
    var d = DIR.indexOf(dChar);
    if (d < 0) throw new Error("Invalid direction: " + dChar);
    var a0=[],b0=[],a1=[],b1=[];
    for (var s = 0; s < m; s++) {
      a0.push(tokens[idx++]);
      b0.push(parseInt(tokens[idx++]));
      a1.push(tokens[idx++]);
      b1.push(parseInt(tokens[idx++]));
    }
    robots.push({m:m, i:ri, j:rj, d:d, a0:a0, b0:b0, a1:a1, b1:b1});
  }
  var wv = [];
  for (var i = 0; i < inp.N; i++) wv.push(tokens[idx++].split(''));
  var wh = [];
  for (var i = 0; i < inp.N - 1; i++) wh.push(tokens[idx++].split(''));
  return {robots:robots, wall_v:wv, wall_h:wh};
}

function hasWall(wv, wh, i, j, d) {
  var N = wv.length;
  var i2 = i + DI[d], j2 = j + DJ[d];
  if (i2 < 0 || i2 >= N || j2 < 0 || j2 >= N) return true;
  if (i == i2) return wv[i][Math.min(j,j2)] == '1';
  return wh[Math.min(i,i2)][j] == '1';
}

function simulate(inp, out) {
  var N = inp.N;
  var mwv = [], mwh = [];
  for (var i = 0; i < N; i++) {
    mwv.push([]);
    for (var j = 0; j < N-1; j++)
      mwv[i].push((inp.wall_v[i][j]=='1'||out.wall_v[i][j]=='1')?'1':'0');
  }
  for (var i = 0; i < N-1; i++) {
    mwh.push([]);
    for (var j = 0; j < N; j++)
      mwh[i].push((inp.wall_h[i][j]=='1'||out.wall_h[i][j]=='1')?'1':'0');
  }
  var routes = [], cycleStarts = [];
  for (var k = 0; k < out.robots.length; k++) {
    var robot = out.robots[k];
    var visited = new Map();
    var route = [];
    var ri = robot.i, rj = robot.j, rd = robot.d, rs = 0;
    var cs = -1;
    for (var t = 0; t < 10000000; t++) {
      route.push({i:ri, j:rj, d:rd, s:rs});
      var key = ((ri*N+rj)*4+rd)*robot.m+rs;
      if (visited.has(key)) { cs = visited.get(key); break; }
      visited.set(key, t);
      var wall = hasWall(mwv, mwh, ri, rj, rd);
      var a, b;
      if (wall) { a=robot.a1[rs]; b=robot.b1[rs]; }
      else { a=robot.a0[rs]; b=robot.b0[rs]; }
      if (a=='R') rd=(rd+1)%4;
      else if (a=='L') rd=(rd+3)%4;
      else { ri+=DI[rd]; rj+=DJ[rd]; }
      rs = b;
    }
    if (cs < 0) throw new Error("Cycle not found for robot " + k);
    routes.push(route);
    cycleStarts.push(cs);
  }
  var fv=[], ftv=[], pat=[];
  for (var i = 0; i < N; i++) {
    fv.push([]); ftv.push([]); pat.push([]);
    for (var j = 0; j < N; j++) { fv[i].push(1e9); ftv[i].push(1e9); pat[i].push(false); }
  }
  for (var k = 0; k < routes.length; k++) {
    for (var t = 0; t < routes[k].length; t++) {
      var p = routes[k][t];
      if (t < fv[p.i][p.j]) fv[p.i][p.j] = t;
      if (t >= cycleStarts[k]) {
        if (t < ftv[p.i][p.j]) ftv[p.i][p.j] = t;
        pat[p.i][p.j] = true;
      }
    }
  }
  var K = out.robots.length;
  var M = 0; for (var k=0;k<K;k++) M += out.robots[k].m;
  var W = 0;
  for (var i=0;i<N;i++) for (var j=0;j<N-1;j++) if (out.wall_v[i][j]=='1') W++;
  for (var i=0;i<N-1;i++) for (var j=0;j<N;j++) if (out.wall_h[i][j]=='1') W++;
  var V = inp.AK*(K-1)+inp.AM*M+inp.AW*W;
  var base = inp.AK*(N*N-1)+inp.AM*(N*N);
  var np = 0;
  for (var i=0;i<N;i++) for (var j=0;j<N;j++) if (pat[i][j]) np++;
  var score = 0;
  if (np == N*N) {
    score = 1;
    if (base > V && V > 0) score += Math.round(1e6*Math.log2(base/V));
  }
  var maxTurn = 0;
  for (var k=0;k<routes.length;k++) if (routes[k].length-1>maxTurn) maxTurn=routes[k].length-1;
  return {routes:routes,cycleStarts:cycleStarts,firstVisit:fv,firstTailVisit:ftv,
    patrolled:pat,mwv:mwv,mwh:mwh,K:K,M:M,W:W,V:V,score:score,numPatrolled:np,maxTurn:maxTurn};
}

function getRobotPos(sim, k, t) {
  if (t < sim.routes[k].length) return sim.routes[k][t];
  var cs = sim.cycleStarts[k];
  var cl = sim.routes[k].length-1-cs;
  if (cl <= 0) return sim.routes[k][sim.routes[k].length-1];
  return sim.routes[k][cs+((t-cs)%cl)];
}

var COLORS=['#e41a1c','#377eb8','#4daf4a','#984ea3','#ff7f00','#a65628',
  '#f781bf','#66c2a5','#fc8d62','#8da0cb','#e78ac3','#a6d854'];

function drawSvg(turn) {
  if (!state || !state.sim) return;
  var inp=state.input, out=state.output, sim=state.sim;
  var N=inp.N, cs=30, sz=N*cs;
  var p = [];
  p.push('<svg id="vis" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" xmlns="http://www.w3.org/2000/svg">');
  p.push('<rect x="0" y="0" width="'+sz+'" height="'+sz+'" fill="#fafafa"/>');
  for (var i=0;i<N;i++) for (var j=0;j<N;j++) {
    var c='#fafafa';
    if (sim.firstTailVisit[i][j]<=turn) c='#cce5ff';
    else if (sim.firstVisit[i][j]<=turn) c='#fff3cd';
    if (turn>=sim.maxTurn && !sim.patrolled[i][j]) c='#f8d7da';
    if (c!='#fafafa')
      p.push('<rect x="'+(j*cs)+'" y="'+(i*cs)+'" width="'+cs+'" height="'+cs+'" fill="'+c+'"><title>('+i+','+j+')</title></rect>');
  }
  for (var i=0;i<=N;i++) {
    p.push('<line x1="0" y1="'+(i*cs)+'" x2="'+sz+'" y2="'+(i*cs)+'" stroke="#ccc" stroke-width="0.5"/>');
    p.push('<line x1="'+(i*cs)+'" y1="0" x2="'+(i*cs)+'" y2="'+sz+'" stroke="#ccc" stroke-width="0.5"/>');
  }
  for (var i=0;i<N;i++) for (var j=0;j<N-1;j++)
    if (inp.wall_v[i][j]=='1')
      p.push('<line x1="'+((j+1)*cs)+'" y1="'+(i*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#000" stroke-width="3"/>');
  for (var i=0;i<N-1;i++) for (var j=0;j<N;j++)
    if (inp.wall_h[i][j]=='1')
      p.push('<line x1="'+(j*cs)+'" y1="'+((i+1)*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#000" stroke-width="3"/>');
  for (var i=0;i<N;i++) for (var j=0;j<N-1;j++)
    if (out.wall_v[i][j]=='1' && inp.wall_v[i][j]!='1')
      p.push('<line x1="'+((j+1)*cs)+'" y1="'+(i*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#dc3545" stroke-width="3"/>');
  for (var i=0;i<N-1;i++) for (var j=0;j<N;j++)
    if (out.wall_h[i][j]=='1' && inp.wall_h[i][j]!='1')
      p.push('<line x1="'+(j*cs)+'" y1="'+((i+1)*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#dc3545" stroke-width="3"/>');
  p.push('<rect x="0" y="0" width="'+sz+'" height="'+sz+'" fill="none" stroke="#000" stroke-width="3"/>');
  for (var k=0;k<sim.routes.length;k++) {
    var pos=getRobotPos(sim,k,turn);
    var cx=pos.j*cs+cs/2, cy=pos.i*cs+cs/2;
    var col=COLORS[k%COLORS.length];
    var r=sim.K<=20?cs/3:sim.K<=50?cs/4:4;
    var fdx=DJ[pos.d],fdy=DI[pos.d];
    var sdx=-fdy,sdy=fdx;
    var tx=cx+fdx*r,ty=cy+fdy*r;
    var b1x=cx-fdx*r*0.5+sdx*r*0.6, b1y=cy-fdy*r*0.5+sdy*r*0.6;
    var b2x=cx-fdx*r*0.5-sdx*r*0.6, b2y=cy-fdy*r*0.5-sdy*r*0.6;
    p.push('<polygon points="'+tx+','+ty+' '+b1x+','+b1y+' '+b2x+','+b2y+'" fill="'+col+'" stroke="#000" stroke-width="0.5" opacity="0.85"><title>Robot '+k+' s='+pos.s+'</title></polygon>');
    if (sim.K<=30) p.push('<text x="'+cx+'" y="'+(cy+3)+'" text-anchor="middle" font-size="7" fill="#000">'+k+'</text>');
  }
  p.push('</svg>');
  document.getElementById('result').innerHTML = p.join('\n');
}

function drawInputOnly(inp) {
  var N=inp.N, cs=30, sz=N*cs;
  var p = [];
  p.push('<svg id="vis" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" xmlns="http://www.w3.org/2000/svg">');
  p.push('<rect x="0" y="0" width="'+sz+'" height="'+sz+'" fill="#fafafa"/>');
  for (var i=0;i<=N;i++) {
    p.push('<line x1="0" y1="'+(i*cs)+'" x2="'+sz+'" y2="'+(i*cs)+'" stroke="#ccc" stroke-width="0.5"/>');
    p.push('<line x1="'+(i*cs)+'" y1="0" x2="'+(i*cs)+'" y2="'+sz+'" stroke="#ccc" stroke-width="0.5"/>');
  }
  for (var i=0;i<N;i++) for (var j=0;j<N-1;j++)
    if (inp.wall_v[i][j]=='1')
      p.push('<line x1="'+((j+1)*cs)+'" y1="'+(i*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#000" stroke-width="3"/>');
  for (var i=0;i<N-1;i++) for (var j=0;j<N;j++)
    if (inp.wall_h[i][j]=='1')
      p.push('<line x1="'+(j*cs)+'" y1="'+((i+1)*cs)+'" x2="'+((j+1)*cs)+'" y2="'+((i+1)*cs)+'" stroke="#000" stroke-width="3"/>');
  p.push('<rect x="0" y="0" width="'+sz+'" height="'+sz+'" fill="none" stroke="#000" stroke-width="3"/>');
  p.push('</svg>');
  document.getElementById('result').innerHTML = p.join('\n');
  document.getElementById('score').textContent = 'Score = (no output)';
  document.getElementById('stats').textContent = 'N='+inp.N+' AK='+inp.AK+' AM='+inp.AM+' AW='+inp.AW;
}

function update_t(t) {
  if (!state || !state.sim) return;
  var mt = state.sim.maxTurn;
  t = Math.max(0, Math.min(parseInt(t)||0, mt));
  currentTurn = t;
  document.getElementById('turn').value = t;
  document.getElementById('t_bar').value = t;
  document.getElementById('score').textContent = 'Score = ' + state.sim.score;
  var s = state.sim, inp = state.input;
  document.getElementById('stats').textContent =
    'N='+inp.N+' AK='+inp.AK+' AM='+inp.AM+' AW='+inp.AW+
    ' | K='+s.K+' M='+s.M+' W='+s.W+' V='+s.V+
    ' | Patrolled='+s.numPatrolled+'/'+(inp.N*inp.N)+
    ' | MaxRoute='+s.maxTurn;
  drawSvg(t);
}

function onInputChange() {
  document.getElementById('play').value = '\u25B6';
  document.getElementById('error').textContent = '';
  var inText = document.getElementById('input').value.trim();
  var outText = document.getElementById('output').value.trim();
  if (!inText) return;
  try {
    var inp = parseInput(inText);
    if (!outText) {
      state = {input:inp, output:null, sim:null};
      drawInputOnly(inp);
      return;
    }
    var out = parseOutput(inp, outText);
    var sim = simulate(inp, out);
    state = {input:inp, output:out, sim:sim};
    document.getElementById('turn').max = sim.maxTurn;
    document.getElementById('t_bar').max = sim.maxTurn;
    update_t(sim.maxTurn);
  } catch(e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('result').innerHTML = '';
  }
}

// Play/pause
var prev = Date.now();
var playBtn = document.getElementById('play');
var speedSlider = document.getElementById('speed');
playBtn.onclick = function() {
  if (playBtn.value === '\u25A0') {
    playBtn.value = '\u25B6';
  } else {
    if (!state || !state.sim) return;
    if (currentTurn >= state.sim.maxTurn) {
      document.getElementById('turn').value = 0;
      currentTurn = 0;
    }
    prev = Date.now();
    playBtn.value = '\u25A0';
  }
};
function autoplay() {
  if (playBtn.value === '\u25A0' && state && state.sim) {
    var now = Date.now();
    var s = 2000;
    if ((now-prev)*speedSlider.value >= s) {
      var inc = Math.floor((now-prev)*speedSlider.value/s);
      prev += Math.floor(inc*s/speedSlider.value);
      update_t(currentTurn+inc);
      if (currentTurn >= state.sim.maxTurn) playBtn.value = '\u25B6';
    }
  }
  requestAnimationFrame(autoplay);
}
autoplay();

// File inputs
document.getElementById('inputFile').onchange = function(e) {
  var f = e.target.files[0];
  if (f) { var r=new FileReader(); r.onload=function(ev){document.getElementById('input').value=ev.target.result;onInputChange();}; r.readAsText(f); }
};
document.getElementById('outputFile').onchange = function(e) {
  var f = e.target.files[0];
  if (f) { var r=new FileReader(); r.onload=function(ev){document.getElementById('output').value=ev.target.result;onInputChange();}; r.readAsText(f); }
};

// Directory selection
document.getElementById('inDirSelect').onchange = function(e) {
  inDirFiles = {};
  Array.from(e.target.files).forEach(function(f){ inDirFiles[f.name]=f; });
};
document.getElementById('outDirSelect').onchange = function(e) {
  outDirFiles = {};
  var files = Array.from(e.target.files);
  files.sort(function(a,b){ return a.name.localeCompare(b.name,undefined,{numeric:true}); });
  outDirNames = files.map(function(f){return f.name;});
  files.forEach(function(f){ outDirFiles[f.name]=f; });
  var sel = document.getElementById('fileSelect');
  sel.innerHTML = '';
  for (var i=0;i<outDirNames.length;i++) {
    var opt = document.createElement('option');
    opt.value = outDirNames[i]; opt.textContent = outDirNames[i];
    sel.appendChild(opt);
  }
  sel.disabled = false;
  if (outDirNames.length > 0) loadFile(outDirNames[0]);
};
document.getElementById('fileSelect').onchange = function(e) { loadFile(e.target.value); };
document.getElementById('prevFile').onclick = function() {
  var sel=document.getElementById('fileSelect');
  if (sel.selectedIndex>0) { sel.selectedIndex--; loadFile(sel.value); }
};
document.getElementById('nextFile').onclick = function() {
  var sel=document.getElementById('fileSelect');
  if (sel.selectedIndex<sel.options.length-1) { sel.selectedIndex++; loadFile(sel.value); }
};
function loadFile(name) {
  if (outDirFiles[name]) {
    var r=new FileReader();
    r.onload=function(ev){document.getElementById('output').value=ev.target.result;onInputChange();};
    r.readAsText(outDirFiles[name]);
  }
  if (inDirFiles[name]) {
    var r2=new FileReader();
    r2.onload=function(ev){document.getElementById('input').value=ev.target.result;onInputChange();};
    r2.readAsText(inDirFiles[name]);
  }
}

// Save as PNG
function savePng() {
  var svgEl = document.getElementById('vis');
  if (!svgEl) return;
  var svgData = new XMLSerializer().serializeToString(svgEl);
  var canvas = document.createElement('canvas');
  canvas.width = svgEl.width.baseVal.value;
  canvas.height = svgEl.height.baseVal.value;
  var ctx = canvas.getContext('2d');
  var image = new Image();
  image.onload = function() {
    ctx.drawImage(image,0,0);
    var a=document.createElement('a');
    a.href=canvas.toDataURL('image/png'); a.download='vis.png'; a.click();
  };
  image.src='data:image/svg+xml;charset=utf-8;base64,'+btoa(unescape(encodeURIComponent(svgData)));
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight') { e.preventDefault(); update_t(currentTurn+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); update_t(currentTurn-1); }
  else if (e.key===' ') { e.preventDefault(); playBtn.click(); }
});
</script>
